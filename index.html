<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa Mental | Compass Rose Systems</title>
<style>
:root{--n:#092d3d;--i:#143747;--p:#f4f8fa;--l:#b4cad4;--g:#b88755;--s:#e6f0f4}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--i);background:var(--p)}header{height:74px;padding:10px clamp(16px,3vw,38px);display:flex;align-items:center;justify-content:space-between;color:#fff;background:var(--n)}.brand{display:flex;align-items:center;gap:11px}.compass{width:40px;height:40px;border:1px solid #c99b70;border-radius:50%;position:relative}.compass:before,.compass:after{content:"";position:absolute;left:50%;top:4px;width:1px;height:30px;background:#d4a876;transform:translateX(-50%)}.compass:after{transform:translateX(-50%) rotate(90deg)}strong{display:block;font:19px Georgia,serif}small{font-size:10px;letter-spacing:.2em;color:#b9cad1}.status{font-size:12px;color:#c6d6db}main{display:grid;grid-template-columns:335px 1fr;min-height:calc(100vh - 74px)}aside{padding:20px;background:#fff;border-right:1px solid #d7e2e6}h2{margin:0 0 8px;font-size:18px}.help{font-size:13px;line-height:1.45;color:#54707e}textarea,input,select{font:inherit;color:var(--i)}#outline{width:100%;min-height:300px;padding:11px;border:1px solid #bfd0d8;border-radius:10px;resize:vertical;font:13px/1.45 monospace}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}button,select{border:0;border-radius:8px;padding:9px 11px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;background:var(--n)}button.alt,select{color:var(--n);background:var(--s)}button.gold{background:var(--g)}button.danger{background:#9c5e3d}.notice{margin-top:15px;padding:10px;border-left:4px solid var(--g);background:#fcf1e4;font-size:12px;line-height:1.45}.board{position:relative;min-width:0;overflow:hidden;background-color:#edf4f6;background-image:radial-gradient(#c8d9e0 1px,transparent 1px);background-size:18px 18px}.tools{position:absolute;z-index:4;top:12px;right:14px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:calc(100% - 28px)}svg{width:100%;height:100%;min-height:650px;display:block;touch-action:none}.edge{stroke:var(--l);stroke-width:2;fill:none}.node{cursor:grab}.node rect{filter:drop-shadow(0 3px 4px #12314224)}.node text{font-size:14px;font-weight:700;fill:var(--i);text-anchor:middle;dominant-baseline:middle;pointer-events:none}.node[data-depth="0"] text{fill:#fff;font-size:18px}.node.selected rect{stroke:var(--n)!important;stroke-width:3}.marker{pointer-events:all;cursor:pointer}.foot{position:absolute;right:14px;bottom:10px;font-size:10px;color:#63808c;letter-spacing:.13em}.back{display:none;position:fixed;z-index:20;inset:0;padding:18px;place-items:center;background:#061e2c99}.back.on{display:grid}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;padding:23px;border-radius:16px;background:#fff;box-shadow:0 20px 65px #06141d88}.modal label{display:block;margin:12px 0 5px;font-size:13px;font-weight:bold}.modal input,.modal textarea{width:100%;padding:10px;border:1px solid #bfced6;border-radius:8px}.modal textarea{min-height:120px;resize:vertical}.content{white-space:pre-wrap;font-size:16px;line-height:1.6}.media{position:relative;width:100%;padding-top:56.25%;margin-top:17px;overflow:hidden;border-radius:12px;background:var(--n)}.media iframe,.media img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}.present{display:none;position:fixed;z-index:30;inset:0;overflow:auto;padding:clamp(22px,5vw,70px);background:#082b3b;color:#eff8fb}.present.on{display:block}.present main{display:block;width:min(1000px,100%);margin:auto}.present-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.route{font-size:12px;line-height:1.4;color:#bdd1d9}.route-box{display:none;margin:12px 0 18px;padding:12px;border:1px solid #477080;border-radius:10px;background:#0c3648;font-size:13px;line-height:1.75}.route-box.on{display:block}.route-box button{display:block;width:100%;margin:4px 0;text-align:left;background:transparent;color:#eff8fb}.badge{display:inline-block;padding:9px 14px;border:1px solid #c49a6d;border-radius:99px;background:#124054;font-size:13px;font-weight:bold}.present h1{font:clamp(29px,5vw,54px) Georgia,serif;margin:20px 0}.present .content{font-size:clamp(17px,2.2vw,23px);color:#e5f0f4}.nav{position:sticky;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 0 4px;background:#082b3b}.nav button{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav .next{justify-self:end}.nav span{min-width:70px;text-align:center;font-size:13px}@media(max-width:760px){header{height:66px}.status{display:none}main{display:block}aside{border-right:0;border-bottom:1px solid #d7e2e6}.tools{position:relative;top:auto;right:auto;max-width:none;padding:11px;background:#fff;border-bottom:1px solid #d7e2e6}.board{overflow:auto}svg{min-height:560px}.foot{display:none}.modal{padding:17px}.present{padding:24px 18px}.nav{grid-template-columns:1fr auto}.nav .next{grid-column:1/3;justify-self:stretch}.nav .danger{display:none}}@media print{@page{size:A4 landscape;margin:10mm}header,aside,.tools,.foot,.back,.present{display:none!important}main{display:block}.board{background:#fff}}
.present{padding-bottom:28px}.present main{min-height:calc(100vh - 140px);display:flex;flex-direction:column}.nav{position:static;margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:15px;padding:22px 0 0;background:transparent;border-top:1px solid #2a5363}.nav button,.nav button.alt,.nav button.danger{padding:5px 0;border:0;background:transparent;box-shadow:none;color:#b8d0d8;font-size:12px;font-weight:600}.nav button:hover{color:#fff;text-decoration:underline}.nav .next{justify-self:end;text-align:right}.nav .danger{color:#7e9ba5}.nav span{color:#d6e6eb;white-space:nowrap}@media(max-width:760px){.present main{min-height:calc(100vh - 48px)}.nav{grid-template-columns:minmax(0,1fr) auto;gap:8px}.nav .next{grid-column:1/3;justify-self:end}.nav .danger{grid-column:1/3;justify-self:end;margin-top:2px}}
.present-head #showRoute{transform:translateY(-14px)}.present .help,.modal .help{display:none}@media(max-width:760px){.present-head #showRoute{transform:translateY(-6px)}}
</style></head><body>
<header><div class="brand"><span class="compass"></span><div><strong>Mapa Mental</strong><small>COMPASS ROSE SYSTEMS</small></div></div><span class="status">Navegação online - sem arquivamento</span></header>
<main><aside><h2>Estrutura por texto</h2><p class="help">A primeira linha é o centro. Use <b>-</b> e dois espaços de recuo para cada nível.</p><textarea id="outline">Lorem ipsum

- Lorem ipsum dolor sit amet
  - Consectetur adipiscing elit
  - Sed do eiusmod tempor

- Ut enim ad minim veniam
  - Quis nostrud exercitation
  - Ullamco laboris</textarea><div class="buttons"><button id="build">Gerar mapa</button><button id="example" class="alt">Restaurar exemplo</button></div><div class="notice"><b>Importante:</b> este mapa não é salvo. Exporte em PDF antes de fechar.</div></aside>
<section class="board" id="board"><div class="tools"><button id="add">+ Tópico</button><button class="alt" id="edit">Editar tópico</button><button class="alt" id="view">Ver conteúdo</button><select id="level"><option value="all">Todos os níveis</option><option value="1">Nível 1</option><option value="2">Nível 2</option><option value="3">Nível 3</option><option value="4">Nível 4</option><option value="5">Nível 5</option></select><button class="alt" id="expand">Expandir</button><button class="alt" id="collapse">Recolher</button><button class="alt" id="fit">Centralizar</button><button class="alt" id="present">Apresentar</button><button class="gold" id="pdf">Exportar PDF</button></div><svg id="svg"><g id="viewport"><g id="edges"></g><g id="nodes"></g></g></svg><span class="foot">COMPASS ROSE SYSTEMS</span></section></main>
<div class="back" id="editBox"><div class="modal"><h2>Editar tópico</h2><label>Título</label><input id="title"><label>Texto detalhado</label><textarea id="text" placeholder="Texto mostrado no pop-up e na apresentação."></textarea><label>Link de vídeo do YouTube</label><input id="video" placeholder="https://www.youtube.com/watch?v=..."><label>Link da imagem</label><input id="image" placeholder="https://.../imagem.jpg ou .png"><div class="buttons"><button class="alt" id="cancel">Cancelar</button><button id="save">Salvar tópico</button></div></div></div>
<div class="back" id="contentBox"><div class="modal"><h2 id="contentTitle"></h2><div id="contentBody"></div><div class="buttons"><button id="close">Fechar</button></div></div></div>
<section class="present" id="presentation"><main><div class="present-head"><span class="route" id="route"></span><button class="alt" id="showRoute">Ver rota do mapa</button></div><div class="route-box" id="routeBox"></div><span class="badge" id="badge"></span><h1 id="presentTitle"></h1><div id="presentBody"></div><div class="nav"><button class="alt" id="prev">Anterior</button><span id="count"></span><button class="next" id="next">Próximo</button><button class="danger" id="exit">Sair da apresentação</button></div></main></section>
<script>
(()=>{const $=q=>document.querySelector(q),svg=$('#svg'),vp=$('#viewport'),edges=$('#edges'),layer=$('#nodes'),sample=$('#outline').value,col=['#dff3fb','#e6f1dc','#fff0d8','#f4e5ef','#ebe6fa'];let roots=[],selected=null,id=1,drag,pan,tr={x:0,y:0,k:1},show={list:[],index:0};
const el=(t,a={})=>{let x=document.createElementNS('http://www.w3.org/2000/svg',t);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));return x};function flat(a,out=[],parent=null,visible=false){a.forEach(n=>{n.parent=parent;out.push(n);if(!visible||!n.closed)flat(n.children,out,n,visible)});return out}function lines(t){let a=[''];t.split(/\s+/).forEach(w=>{let i=a.length-1;if((a[i]+' '+w).trim().length>19)a.push(w);else a[i]=(a[i]+' '+w).trim()});return a.slice(0,4)}function measure(n){let z=lines(n.text);return{w:Math.max(n.depth?140:195,...z.map(x=>x.length*8+28)),h:Math.max(50,z.length*19+22)}}function parse(t){let rows=t.split(/\r?\n/).filter(x=>x.trim());if(!rows.length)return[];id=1;let r={id:id++,text:rows[0].trim(),children:[],depth:0};let stack=[{l:-1,n:r}];rows.slice(1).forEach(row=>{let l=Math.floor(row.match(/^\s*/)[0].length/2),t=row.trim().replace(/^[-*]\s*/,'');while(stack.at(-1).l>=l)stack.pop();let p=stack.at(-1).n,n={id:id++,text:t,children:[],depth:p.depth+1,detail:'',video:'',image:''};p.children.push(n);stack.push({l,n})});return[r]}function layout(){let levels=[],a=flat(roots,[],null,true);a.forEach(n=>(levels[n.depth]??=[]).push(n));levels.forEach((g,d)=>g.forEach((n,i)=>{let m=measure(n);Object.assign(n,m,{x:150+d*235,y:82+i*116})}));svg.style.minHeight=Math.max(650,...levels.map(g=>g.length*116+110))+'px'}function apply(){vp.setAttribute('transform',`translate(${tr.x} ${tr.y}) scale(${tr.k})`)}function render(){edges.innerHTML='';layer.innerHTML='';flat(roots,[],null,true).forEach(n=>{if(n.parent)edges.append(el('path',{class:'edge',d:`M ${n.parent.x+n.parent.w/2} ${n.parent.y} C ${n.parent.x+92} ${n.parent.y}, ${n.x-92} ${n.y}, ${n.x-n.w/2} ${n.y}`}));let g=el('g',{class:'node'+(n===selected?' selected':''),'data-id':n.id,'data-depth':n.depth,transform:`translate(${n.x},${n.y})`});g.append(el('rect',{x:-n.w/2,y:-n.h/2,width:n.w,height:n.h,rx:13,fill:n.depth?'#fff':'#092d3d',stroke:n.depth?col[(n.depth-1)%col.length]:'#092d3d'}));let z=lines(n.text);z.forEach((x,i)=>{let q=el('text',{x:0,y:(i-(z.length-1)/2)*19});q.textContent=x;g.append(q)});if(n.children.length){let m=el('text',{class:'marker',x:n.w/2-15,y:-n.h/2+14,style:'font-size:18px;fill:#466675'});m.textContent=n.closed?'+':'−';m.addEventListener('pointerdown',e=>{e.stopPropagation();n.closed=!n.closed;layout();render();fit()});g.append(m)}g.addEventListener('pointerdown',start);g.addEventListener('dblclick',()=>content(n));layer.append(g)});apply()}function fit(){let a=flat(roots,[],null,true);if(!a.length)return;let minx=Math.min(...a.map(n=>n.x-n.w/2)),maxx=Math.max(...a.map(n=>n.x+n.w/2)),miny=Math.min(...a.map(n=>n.y-n.h/2)),maxy=Math.max(...a.map(n=>n.y+n.h/2)),k=Math.min(.95,svg.clientWidth/(maxx-minx+90),svg.clientHeight/(maxy-miny+90));tr={k,x:svg.clientWidth/2-(minx+maxx)/2*k,y:svg.clientHeight/2-(miny+maxy)/2*k};apply()}function point(e){let r=svg.getBoundingClientRect();return{x:(e.clientX-r.left-tr.x)/tr.k,y:(e.clientY-r.top-tr.y)/tr.k}}function hit(n,x,y){return flat(roots,[],null,true).some(o=>o!==n&&Math.abs(x-o.x)<(n.w+o.w)/2+14&&Math.abs(y-o.y)<(n.h+o.h)/2+14)}function start(e){e.stopPropagation();let n=flat(roots,[],null,true).find(x=>x.id==e.currentTarget.dataset.id);selected=n;let p=point(e);drag={n,dx:p.x-n.x,dy:p.y-n.y};render()}svg.addEventListener('pointerdown',e=>{if(e.target===svg||e.target===vp)pan={x:e.clientX,y:e.clientY,tx:tr.x,ty:tr.y}});svg.addEventListener('pointermove',e=>{if(drag){let p=point(e),x=p.x-drag.dx,y=p.y-drag.dy;if(!hit(drag.n,x,y)){drag.n.x=x;drag.n.y=y;render()}}else if(pan){tr.x=pan.tx+e.clientX-pan.x;tr.y=pan.ty+e.clientY-pan.y;apply()}});svg.addEventListener('pointerup',()=>{drag=pan=null});svg.addEventListener('wheel',e=>{e.preventDefault();let r=svg.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,o=tr.k;tr.k=Math.max(.25,Math.min(2.4,o*(e.deltaY<0?1.1:.9)));tr.x=x-(x-tr.x)*tr.k/o;tr.y=y-(y-tr.y)*tr.k/o;apply()},{passive:false});
function yid(u){return String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/)?.[1]||''}function body(n){let b=document.createElement('div'),v=yid(n.video);if(n.detail){let x=document.createElement('div');x.className='content';x.textContent=n.detail;b.append(x)}if(v){let w=document.createElement('div');w.className='media';let f=document.createElement('iframe');f.src=`https://www.youtube-nocookie.com/embed/${v}`;f.allowFullscreen=true;w.append(f);b.append(w)}if(n.image){let w=document.createElement('div');w.className='media',im=document.createElement('img');im.src=n.image;im.alt=n.text;w.append(im);b.append(w)}if(!n.detail&&!v&&!n.image){let p=document.createElement('p');p.className='help';p.textContent='Este tópico ainda não possui texto, vídeo ou imagem vinculados.';b.append(p)}return b}function edit(n){if(!n)return;selected=n;$('#title').value=n.text;$('#text').value=n.detail||'';$('#video').value=n.video||'';$('#image').value=n.image||'';$('#editBox').classList.add('on')}function content(n){if(!n)return;selected=n;$('#contentTitle').textContent=n.text;$('#contentBody').innerHTML='';$('#contentBody').append(body(n));$('#contentBox').classList.add('on')}function route(n){let a=[];for(let x=n;x;x=x.parent)a.unshift(x.text);return a.join(' › ')}function renderRoute(){let box=$('#routeBox');box.innerHTML='';show.list.forEach((n,i)=>{let b=document.createElement('button');b.textContent=`${i+1}. ${n.text}`;b.onclick=()=>{show.index=i;box.classList.remove('on');showit()};box.append(b)})}function present(){show={list:flat(roots,[],null,true),index:0};if(!show.list.length)return;$('#presentation').classList.add('on');$('#presentation').requestFullscreen?.();renderRoute();showit()}function showit(){let n=show.list[show.index],previous=show.list[show.index-1],next=show.list[show.index+1];selected=n;$('#badge').textContent=`Tópico ${show.index+1} de ${show.list.length}`;$('#route').textContent=route(n);$('#presentTitle').textContent=n.text;$('#presentBody').innerHTML='';$('#presentBody').append(body(n));$('#count').textContent=`${show.index+1} / ${show.list.length}`;$('#prev').textContent=previous?`← Anterior: ${previous.text}`:'← Início';$('#prev').disabled=!previous;$('#next').textContent=next?`Próximo: ${next.text} →`:'Fim da apresentação';$('#next').disabled=!next;render()}function build(){roots=parse($('#outline').value);selected=null;layout();render();fit()}function fold(open){let l=$('#level').value;flat(roots).forEach(n=>{if(n.children.length&&(l==='all'||n.depth==l))n.closed=!open});layout();render();fit()}
$('#build').onclick=build;$('#example').onclick=()=>{$('#outline').value=sample;build()};$('#add').onclick=()=>{let p=selected||roots[0];if(!p)return;let n={id:id++,text:'Novo subtópico',children:[],depth:p.depth+1,detail:'',video:'',image:''};p.children.push(n);selected=n;layout();render();edit(n)};$('#edit').onclick=()=>edit(selected);$('#view').onclick=()=>content(selected);$('#save').onclick=()=>{if(!selected)return;selected.text=$('#title').value.trim()||selected.text;selected.detail=$('#text').value.trim();selected.video=$('#video').value.trim();selected.image=$('#image').value.trim();$('#editBox').classList.remove('on');layout();render()};$('#cancel').onclick=()=>$('#editBox').classList.remove('on');$('#close').onclick=()=>$('#contentBox').classList.remove('on');[$('#editBox'),$('#contentBox')].forEach(x=>x.onclick=e=>{if(e.target===x)x.classList.remove('on')});$('#expand').onclick=()=>fold(true);$('#collapse').onclick=()=>fold(false);$('#fit').onclick=fit;$('#present').onclick=present;$('#showRoute').onclick=()=>$('#routeBox').classList.toggle('on');$('#prev').onclick=()=>{show.index=Math.max(0,show.index-1);showit()};$('#next').onclick=()=>{show.index=Math.min(show.list.length-1,show.index+1);showit()};$('#exit').onclick=()=>{$('#presentation').classList.remove('on');if(document.fullscreenElement)document.exitFullscreen();fit()};$('#pdf').onclick=()=>window.print();window.addEventListener('resize',()=>{layout();render();fit()});build()})();
</script></body></html>
